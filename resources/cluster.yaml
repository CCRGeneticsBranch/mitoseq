# Cluster resources per rule
__default__:
    gres: lscratch:96
    mem: 4g
    threads: 2
    time: 00-00:30:00
    partition: norm
    name: "{rule}.{wildcards}"
    output: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.out"
    error: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.err"

fastq_to_ubam:
    mem: 1g

align_bam:
    mem: 14g
    threads: 16

group_reads:
    mem: 8g
    threads: 2

call_consensus_reads:
    mem: 8g
    threads: 4

align_consensus_bam:
    gres: lscratch:500
    mem: 14g
    threads: 16    
    
filter_consensus_reads:
    mem: 8g
    threads: 8

varscan_paired:
    threads: 4
    mem: 32g

mutect2_mt:
    mem: 32g
    time: 00-01:00:00

mutect2_paired:
    mem: 32g
    time: 00-01:00:00
