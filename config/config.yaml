# References

workdir:
    WORKDIR
scriptsdir:
    PIPELINE_HOME/workflow/scripts/
manifest:
    WORKDIR/config/samples.tsv
tools:
    PIPELINE_HOME/resources/tools.yaml
cluster:
    PIPELINE_HOME/resources/cluster.yaml

# Reference genome
genome: hg38

hg38:
    ref:
        /fdb/genomebrowser/fasta/hg38.fa
    bwa_ref:
        /fdb/bwa/indexes/hg38.fa
    bait:
        PIPELINE_HOME/resources/xgen-human-mtdna-hyb-panel-probes.bed
    target:
        PIPELINE_HOME/resources/xgen-human-mtdna-hyb-panel-targets.bed
    vep:
        "--ncbi-build GRCh38 --species homo_sapiens"

mm10:
    ref:
        /fdb/genomebrowser/fasta/mm10.fa
    bwa_ref:
        /fdb/bwa/indexes/mm10.fa
    bait:
        PIPELINE_HOME/resources/xGen_mm_mtDNA_panel_probes.bed    
    target:
        PIPELINE_HOME/resources/xGen_mm_mtDNA_panel_targets.bed
    vep:
        "--ncbi-build GRCm38 --species mus_musculus"

